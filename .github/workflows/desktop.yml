name: Linux desktop preview

on:
  push:
    paths:
      - "desktop/**"
      - "desktopApp/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "desktopApp/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/desktop.yml"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install desktop package and Tk
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk
          python -m pip install -e ./desktop
      - name: Run unit tests
        run: python -m unittest discover -s desktop/tests -v
      - name: Check imports and syntax
        run: |
          python -m compileall -q desktop/bitchord_desktop
          python -c "import bitchord_desktop.app"

  compose-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and test Compose Desktop
        run: ./gradlew --configure-on-demand :desktopApp:test :desktopApp:compileKotlin
