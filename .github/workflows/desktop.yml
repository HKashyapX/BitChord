name: Linux desktop preview

on:
  push:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install desktop package and Tk
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk
          python -m pip install -e ./desktop
      - name: Run unit tests
        run: python -m unittest discover -s desktop/tests -v
      - name: Check imports and syntax
        run: |
          python -m compileall -q desktop/bitchord_desktop
          python -c "import bitchord_desktop.app"
